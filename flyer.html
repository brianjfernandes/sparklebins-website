<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkle Bins Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #e0e0e0;
      font-family: 'Inter', sans-serif;
    }

    .flyer {
      width: 4in;
      height: 4in;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .flyer-top {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: #fff;
      padding: 24px 22px 20px;
      text-align: center;
    }

    .flyer-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .flyer-tagline {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0.9;
    }

    .flyer-body {
      flex: 1;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .services {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .service {
      text-align: center;
      flex: 1;
    }

    .service-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: #2ecc71;
      display: inline-block;
      padding: 5px 12px;
      border-radius: 50px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .service-text {
      font-size: 0.9rem;
      color: #555;
      margin-top: 5px;
      line-height: 1.3;
    }

    .divider {
      height: 1px;
      background: #e8e8e8;
      margin: 10px 0;
    }

    .flyer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .price-section {
      text-align: center;
    }

    .price {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: #27ae60;
      line-height: 1;
    }

    .price-sub {
      font-size: 0.95rem;
      color: #2c3e50;
      font-weight: 500;
    }

    .price-discount {
      font-size: 0.7rem;
      color: #27ae60;
      white-space: nowrap;
      font-weight: 600;
      margin-top: 4px;
    }

    .contact-section {
      text-align: center;
      flex: 1;
    }

    .contact-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #2c3e50;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .contact-phone {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #2c3e50;
      white-space: nowrap;
    }

    .qr-section {
      text-align: center;
    }

    .qr-code img {
      width: 80px;
      height: 80px;
      border-radius: 4px;
    }

    .qr-label {
      font-size: 0.75rem;
      color: #000000;
      font-weight: 600;
      margin-top: 3px;
    }
    @media print {
      body {
        background: none;
        min-height: auto;
      }
      .flyer {
        box-shadow: none;
        border-radius: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="flyer-top">
      <div class="flyer-title">Sparkle Bins</div>
      <div class="flyer-tagline">Trash Can Cleaning Service</div>
    </div>

    <div class="flyer-body">
      <div class="services">
        <div class="service">
          <div class="service-label">Scrub</div>
          <div class="service-text">Deep clean<br>inside & out</div>
        </div>
        <div class="service">
          <div class="service-label">Sanitize</div>
          <div class="service-text">Kill germs<br>& bacteria</div>
        </div>
        <div class="service">
          <div class="service-label">Deodorize</div>
          <div class="service-text">Remove bad<br>odors</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="flyer-bottom">
        <div class="price-section">
          <div class="price">$20</div>
          <div class="price-sub">per can</div>
          <div class="price-discount">Multi-can discount</div>
        </div>

        <div class="contact-section">
          <div class="contact-label">Call or Text Declan</div>
          <div class="contact-phone">(619) 559-7499</div>
        </div>

        <div class="qr-section">
          <div class="qr-code"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://brianjfernandes.github.io/sparklebins-website/" alt="QR Code"></div>
          <div class="qr-label">Scan for more info</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
